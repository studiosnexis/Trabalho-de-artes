<script>

const T=[
['Coliseu','Anfiteatro Flávio · Roma',
`Vespasiano iniciou a obra por volta de 70–72 d.C. sobre o antigo lago da Domus Aurea de Nero, devolvendo ao povo o terreno que o tirano tomara. Tito o inaugurou em 80 d.C. com cem dias de jogos; Domiciano acrescentou o hipogeu e o último nível. Das 80 arcadas, 76 eram para o público, com fichas numeradas que indicavam portão, setor e fileira.`,
`Estruturalmente, é um sistema de pilares de travertino, arcos e abóbadas de concreto que sustenta uma cávea de cerca de 50 mil lugares, hierarquizada por classe: senadores junto à arena, o povo no alto. A fachada sobrepõe as ordens dórica, jônica e coríntia sob um ático com consolos para os mastros do velarium, o toldo manobrado por marinheiros. Sob o piso de madeira, elevadores e alçapões faziam feras e cenários surgirem “do nada”.`,
[['Data','70–80 d.C. (hipogeu: c. 81–96)'],['Dimensão','189 × 156 m · cerca de 48 m'],['Material','travertino, tufo, tijolo, concreto']]],
['Panteão','Templo de todos os deuses · Roma',
`Adriano reconstruiu, por volta de 118–125 d.C., o templo de Agripa destruído por incêndios, mas manteve no pórtico a inscrição que atribui a obra ao antigo construtor. Atrás de 16 colunas monolíticas de granito, a rotunda guarda a surpresa: nela cabe uma esfera perfeita de 43,3 m de diâmetro, pois a altura até o óculo é igual ao diâmetro.`,
`A cúpula é de concreto sem armadura. A espessura cai de cerca de 6 m na base para 1,2 m junto ao óculo, e o agregado muda de pesado (travertino e tijolo) para leve (tufo e escória vulcânica) conforme sobe. Os 140 caixotões aliviam o peso e criam o ritmo geométrico. O óculo, de cerca de 8,2 m, é a única janela: o sol desenha um disco que percorre as paredes ao longo do dia e das estações.`,
[['Data','c. 118–125 d.C. (Adriano)'],['Dimensão','ø 43,3 m · óculo ≈ 8,2 m'],['Material','concreto, tijolo, granito, mármores']]],
['Augusto de Prima Porta','Estátua-manifesto · Museus do Vaticano',
`Achada em 1863 na Villa de Lívia, em Prima Porta, é uma cópia em mármore, do início do século I d.C., de um bronze talvez de c. 20 a.C. O corpo imita o Doríforo de Políclito (peso sobre uma perna, ombros e quadris em contraposto), mas o rosto, sereno e atemporal, é um retrato idealizado: Augusto em plena maturidade, para sempre.`,
`A couraça é um manifesto político. No centro, um parta entrega a um romano (Tibério ou o deus Marte, a identificação é debatida) a águia perdida por Crasso, recuperada por diplomacia em 20 a.C. Acima, o Céu estende o manto e o Sol conduz sua quadriga; embaixo, Tellus segura cornucópias. O golfinho e Cupido junto ao pé evocam Vênus, ancestral dos Júlios, e os pés descalços sugerem heroização. Restam traços de policromia.`,
[['Data','original c. 20 a.C. · cópia séc. I d.C.'],['Dimensão','≈ 2,04 m'],['Material','mármore']]],
['Coluna de Trajano','Narrativa em espiral · Fórum de Trajano',
`Inaugurada em 113 d.C., a coluna celebra as duas guerras dácias (101–102 e 105–106 d.C.), que anexaram a Dácia e suas minas de ouro. Atribuída a Apolodoro de Damasco, é feita de tambores de mármore de Luni (Carrara). Uma escada em espiral escavada no interior, de cerca de 185 degraus, leva ao topo, onde havia a estátua do imperador (hoje é São Pedro, desde 1587).`,
`Uma faixa helicoidal de cerca de 200 m, com aproximadamente 2.500 figuras e 155 cenas, sobe como um rolo de papiro em pedra. Trajano aparece dezenas de vezes: discursa, sacrifica, consulta oficiais. A narrativa valoriza a logística — pontes de barcas, fortes, legionários cortando árvores — e a faixa alarga-se de ≈ 0,9 m para ≈ 1,2 m no alto para ajudar a leitura. Era pintada, e as cores distinguiam romanos de dácios.`,
[['Data','113 d.C.'],['Dimensão','≈ 30 m (35 m com pedestal)'],['Material','mármore de Luni']]],
['Arco de Tito','Relevo e triunfo · Via Sacra, Roma',
`Erguido por Domiciano após a morte de Tito (81 d.C.), o arco celebra a tomada de Jerusalém e a destruição do Templo em 70 d.C. Tem um único vão e cerca de 15,4 m de altura, e é um dos primeiros monumentos a usar a ordem compósita em escala monumental. Sua inscrição o dedica ao “divino Tito”, já deificado.`,
`No passadiço, dois relevos se opõem: de um lado, soldados carregam os despojos do Templo — a menorá, a mesa dos pães da proposição e trombetas de prata; do outro, Tito triunfa numa quadriga coroado pela Vitória. O escultor cria profundidade graduando o relevo, alto na frente e raso ao fundo, de modo que a procissão parece entrar na parede. Análises recentes encontraram ocre amarelo sobre a menorá; o dourado do modelo é reconstrução hipotética.`,
[['Data','c. 81 d.C.'],['Dimensão','≈ 15,4 × 13,5 m'],['Material','mármore pentélico']]],
['Ara Pacis','O altar da paz de Augusto · Roma',
`O Senado votou o altar em 13 a.C., quando Augusto voltou da Hispânia e da Gália, e o dedicou em 9 a.C. no Campo de Marte, perto do mausoléu do imperador. O recinto é um muro retangular de mármore de Luni (cerca de 11,6 × 10,6 m), aberto ao céu, com duas portas e o altar de sacrifícios no centro.`,
`Por fora, o friso inferior é um mar de acantos, flores e animais: a natureza próspera da nova Idade de Ouro. Acima, a procissão mostra Augusto, sacerdotes, magistrados e a família, com crianças puxando as togas, uma ideia de dinastia nunca antes tão explícita. Nos lados curtos aparecem Enéas sacrificando, a loba com os gêmeos, Roma armada e Tellus com os filhos. É propaganda sofisticada: paz = religião + fertilidade + herdeiros. Remontado em 1938, hoje fica no museu projetado por Richard Meier (2006).`,
[['Data','13–9 a.C.'],['Dimensão','≈ 11,6 × 10,6 m'],['Material','mármore de Luni']]],
['Vila dos Mistérios','Afrescos de Pompeia',
`Perto da Porta Ercolano, em Pompeia, uma sala da villa recebeu por volta de 60–50 a.C. um friso de cerca de 17 m com aproximadamente 29 figuras em tamanho natural sobre fundo vermelho, pintadas a fresco e finalizadas a seco. As figuras parecem pisar numa plataforma pintada, no mesmo chão do visitante, e o vermelho imita materiais caros.`,
`Nenhuma legenda explica a cena — e isso a torna fascinante: um menino lê um rolo, silenos tocam lira, uma mulher é açoitada, outra descobre um objeto oculto sob um pano (o liknon, com um falo) e Dioniso repousa no colo de uma figura feminina. A leitura dominante é a de uma iniciação nos ritos dionisíacos, talvez ligada ao casamento, mas a ordem das cenas e a identidade de várias figuras seguem em debate.`,
[['Data','c. 60–50 a.C.'],['Dimensão','friso ≈ 17 m · ≈ 29 figuras'],['Técnica','afresco (Segundo Estilo)']]],
['Mosaico de Alexandre','Casa do Fauno, Pompeia · Nápoles',
`Achado em 1831 na exedra da Casa do Fauno, é um piso de cerca de 5,82 × 3,13 m com perto de 1,5 milhão de tesselas, algumas com poucos milímetros. Foi feito no século II a.C. a partir de um quadro helenístico do fim do século IV a.C., talvez de Filoxeno de Erétria. Hoje está no Museu Arqueológico Nacional de Nápoles.`,
`Alexandre, à esquerda, avança sem capacete; Dario, em seu carro, estende a mão a um guarda que morre. O pintor original cria volume com hachuras e escorços: um cavalo visto de trás, um rosto refletido num escudo. Lanças verticais fecham o fundo, enquanto diagonais empurram o olhar da cabeça de Alexandre ao rosto aflito do rei persa. A cena é em geral associada à Batalha de Isso (333 a.C.).`,
[['Data','séc. II a.C. (cópia de c. 300 a.C.)'],['Dimensão','≈ 5,82 × 3,13 m'],['Material','tesselas de pedra']]],
['Marco Aurélio','Estátua equestre · Capitólio',
`Fundida por volta de 175 d.C., a estátua de cerca de 4,24 m é o único grande bronze equestre romano que chegou inteiro até nós, em parte porque na Idade Média foi tomada por Constantino, o imperador cristão. Michelangelo a colocou no centro da Piazza del Campidoglio em 1538; o original, restaurado entre 1981 e 1990, está hoje coberto nos Museus Capitolinos, e a praça exibe uma cópia.`,
`O imperador não leva armas nem estribos (que ainda não existiam em Roma): estende o braço direito num gesto de clemência e comando. Sob a pata dianteira erguida, um inimigo vencido provavelmente completava o grupo. O cavalo condensa energia contida, e o conjunto diz que o poder domina sem violência. O bronze guarda restos de douração; a pátina escura de hoje é fruto de séculos.`,
[['Data','c. 175 d.C.'],['Dimensão','≈ 4,24 m'],['Material','bronze']]],
['Termas de Caracala','Cidade dentro de um edifício · Roma',
`Inauguradas em 216 d.C. por Caracala, ocupavam um recinto de 337 × 328 m, com o bloco de banhos de cerca de 214 × 110 m no centro. A água chegava por um ramal do Aqua Marcia, e fornos em um subsolo de galerias de serviço aqueciam ar e água por meio de hipocaustos sob pisos e paredes.`,
`O percurso ia da palestra (exercício) ao caldarium circular de cerca de 35 m de diâmetro, com grandes janelas voltadas para o sol da tarde, passava pelo tepidarium e pelo frigidarium, sob três abóbadas de aresta, e terminava na natatio ao ar livre. Em volta havia jardins, lojas, bibliotecas e esculturas como o Hércules Farnese. Era um espaço de saúde, negócios e conversa. O abastecimento acabou em 537, quando os godos cortaram os aquedutos.`,
[['Data','212–216 d.C.'],['Dimensão','recinto 337 × 328 m'],['Material','tijolo, concreto, mármores']]]
];
const E=[['Estrutura de travertino e concreto em grande parte conservada; inscrições de restauro e fichas de ingresso.','Funções dos andares e divisão dos assentos por classe vêm de inscrições nos degraus e de textos antigos.','O velarium e o piso de madeira da arena são reconstruídos a partir de consolos e fontes escritas.'],['Edifício quase intacto, com a inscrição de Agripa e tijolos estampados que datam a obra de Adriano.','O sentido do óculo (luz, símbolo do cosmos) e do projeto circular é debatido.','As telhas de bronze dourado da cúpula são citadas em fontes; seu aspecto exato é reconstruído.'],['Mármore com vestígios de pigmentos vermelho e azul identificados em análises.','O papel de cada símbolo da couraça, em especial quem recebe a águia, é debatido.','A policromia completa mostrada em cópias coloridas é hipótese a partir dos traços achados.'],['Fuste e relevos sobrevivem; moldes antigos permitem estudar cenas hoje desgastadas.','Ler o friso como narrativa histórica contínua é uma interpretação.','As cores originais e possíveis acréscimos de metal são hipóteses.'],['Relevos e inscrição visíveis; análises com luz detectaram traços de ocre amarelo na menorá.','A procissão representa o triunfo de 71 d.C.; a quadriga segue convenções de propaganda.','A cor completa e a decoração do alto do arco são visualizações artísticas.'],['Fragmentos originais em Roma e em museus como Louvre e Uffizi, reunidos e completados na remontagem de 1938.','Quem aparece na procissão e o sentido de cada gesto seguem debatidos.','A pintura e o aspecto exato do interior do altar são reconstruções.'],['Afrescos conservados no local, preservados pela erupção de 79 d.C., com restauros modernos.','A ordem das cenas e o sentido de cada figura (iniciação, casamento, rito dionisíaco) são debatidos.','A sala virtual e a iluminação são reconstrução; a função original da sala é hipotética.'],['Piso original achado em 1831 e levado a Nápoles em 1843; há falhas e restauros visíveis.','A identificação da batalha (Isso ou Gaugamela) e do pintor original é interpretação.','A pintura helenística perdida só é conhecida pela cópia; suas cores são reconstrução.'],['Bronze original sobrevivente, com restos de douração e fundição por partes.','O inimigo sob a pata e a data (c. 175 d.C.) são deduzidos por comparação com outras obras.','O aspecto dourado e o grupo completo são reconstruções.'],['Muros de tijolo, abóbadas caídas, inscrições e túneis subterrâneos ainda existentes.','Usos de cada sala e capacidade (≈ 1.600 banhistas) são estimativas de estudiosos.','Mármores, mosaicos e cores dos ambientes são reconstruídos.']];

{n:'Imperador',p:'Princeps e imperadores, de Augusto a Marco Aurélio',i:'Você concentra o poder militar, político e religioso do Império, mas governa com a imagem de primeiro entre os cidadãos.',r:['Recebe senadores e clientes na saudação matinal e despacha petições e cartas de governadores.','Preside julgamentos, ouve embaixadas e decide sobre obras, impostos e abastecimento de grãos.','Participa de banquetes e jogos, ocasiões de contato com o povo e de demonstração de poder.'],a:['Comandar os exércitos e nomear governadores','Garantir o abastecimento de Roma (a annona) e oferecer jogos e obras públicas','Atuar como pontífice máximo, chefe da religião do Estado','Funcionar como instância final de justiça e cuidar da sucessão'],v:['Comando supremo (imperium) e poder tribunício','Guarda pessoal, os pretorianos, e residência no Palatino','Controle do tesouro imperial e de vastas propriedades','Imagem em moedas, estátuas e monumentos por todo o Império'],l:['Precisa do apoio do exército, do Senado e do povo para se manter','Sem regra fixa de sucessão: depende de adoção, aclamação ou força','Augusto evitava o título de rei, que os romanos associavam à tirania'],d:['Risco constante de conspiração e assassinato, como em Calígula, Domiciano e Cômodo','Fronteiras extensas e guerras simultâneas','Crises como incêndios, epidemias e fomes']},
{n:'Senador',p:'Ordem senatorial, séculos I a.C. a II d.C.',i:'Você pertence à elite que ocupa as magistraturas e as grandes províncias, mas depende cada vez mais do favor do imperador.',r:['Recebe clientes em casa, cuida de assuntos jurídicos e dos negócios das terras.','Vai à Cúria nos dias de sessão, debate, vota e ouve relatórios.','Oferece ou frequenta jantares onde se fazem alianças e se mede o prestígio.'],a:['Participar das sessões do Senado e aconselhar o imperador','Percorrer o cursus honorum: questor, edil, pretor e cônsul','Governar províncias e comandar legiões como legado','Financiar espetáculos e obras para ganhar prestígio'],v:['Toga com faixa larga púrpura e assento reservado nos espetáculos','Acesso a cargos, comandos e governos provinciais','Grande riqueza em terras e clientes dependentes'],l:['Patrimônio mínimo de 1 milhão de sestércios sob Augusto','O comércio era malvisto entre a elite','Carreira e segurança política dependiam do imperador'],d:['Acusações de traição (maiestas) sob imperadores desconfiados','Altos gastos com cargos, jogos e festas','Perda de influência real, pois o poder se concentrou no princeps']},
{n:'Soldado',p:'Legionário, de Augusto aos Severos',i:'Você é cidadão romano numa legião, sustentando as fronteiras e construindo a infraestrutura do Império.',r:['Toque de alvorada, inspeção, treino com armas e exercícios de formação.','Marchas com equipamento, construção de fortes, estradas e pontes, ou serviço de guarda.','Refeição com o grupo (contubernium, de cerca de 8 homens), cuidado das armas e descanso.'],a:['Combater em formação e obedecer à cadeia de comando dos centuriões','Construir e manter fortes, estradas e obras','Policiar e guarnecer fronteiras e cidades'],v:['Soldo regular: 225 denários por ano sob Augusto e 300 sob Domiciano','Donativos em ocasiões especiais e prêmio de fim de serviço, em dinheiro ou terra','Tratamento nos hospitais militares e chance de subir a centurião'],l:['Serviço de cerca de 25 anos, longe da família','Até 197 d.C. soldados não podiam casar legalmente','Parte do soldo era descontada para alimentação, roupa e equipamento'],d:['Disciplina severa, com castigos como a dizimação','Campanhas em terras distantes, da Britânia ao Danúbio','Ferimentos e doenças, sem garantia de chegar ao fim do serviço']},
{n:'Comerciante',p:'Mercator, de Óstia ao Mediterrâneo',i:'Você move mercadorias entre portos e mercados, lucrando com a paz e com a rede de estradas e rotas marítimas.',r:['Abre a taberna ao amanhecer, confere o estoque e atende os clientes.','Negocia com fornecedores e transportadores e acompanha navios e armazéns, sobretudo em portos como Óstia.','Fecha as contas, registra dívidas e contratos e participa de associações profissionais (collegia).'],a:['Pagar tributos e taxas de porto','Manter pesos e medidas corretos, sob fiscalização dos edis','Honrar contratos e contas com fornecedores e credores'],v:['Possibilidade de enriquecer, mesmo para libertos','Associações (collegia) que davam apoio, festas e enterro digno','Moeda aceita em todo o Mediterrâneo e acesso às rotas do Império'],l:['Baixo prestígio aos olhos da elite aristocrática','Dependência de patronos, de crédito e de boa reputação para fechar negócios'],d:['Naufrágios, pilhagem e pirataria','Oscilação de preços, sobretudo do grão','Incêndios e dívidas que podiam arruinar o negócio']},
{n:'Gladiador',p:'Escola de gladiadores e arena, séculos I a.C. a III d.C.',i:'Você vive e treina numa escola de gladiadores, onde seu corpo é o investimento de um dono e sua luta é o espetáculo do povo.',r:['Treino com instrutores (doctores) nas armas e técnicas do seu tipo de combate.','Alimentação reforçada, em geral cevada e leguminosas, com massagem e cuidado médico.','Disciplina no alojamento da escola. Nos dias de jogos, preparação e combate na arena.'],a:['Obedecer ao lanista, dono da escola, e ao juramento de submissão','Lutar conforme as regras do seu tipo, como murmillo, retiário ou trácio','Oferecer espetáculo ao público e aos organizadores dos jogos'],v:['Fama e admiradores, mesmo entre a elite','Prêmios em dinheiro, a palma da vitória e presentes','Chance de liberdade, simbolizada pela espada de madeira (rudis)'],l:['Muitos eram escravizados, prisioneiros ou condenados','Mesmo os voluntários perdiam direitos e sofriam infâmia legal','Pouco controle sobre contratos, locais e adversários'],d:['Risco de ferimento ou morte, embora lutadores treinados fossem caros e nem toda luta terminasse em morte','Rotina de violência e pressão do público','Carreira curta e vida muitas vezes breve']}];
const TB=[['Rotina','r'],['Responsabilidades','a'],['Privilégios','v'],['Limitações','l'],['Dificuldades','d']];let dr=-1,dt=0;
DS.forEach((d,i)=>{const b=document.createElement('button');b.dataset.b='';b.textContent=d.n;b.onclick=()=>{dr=i;dt=0;ds(true)};$('#dr').append(b)});bb($('#dr'));
function ds(sc){const d=DS[dr],p=$('#dp');p.hidden=false;document.querySelectorAll('#dr button').forEach((b,i)=>b.classList.toggle('on',i==dr));
const tc=dt==0?`<div class="rt">${['Manhã','Tarde','Noite'].map((h,k)=>`<div><b>${h}</b>${d.r[k]}</div>`).join('')}</div>`:`<ul>${d[TB[dt][1]].map(x=>`<li>${x}</li>`).join('')}</ul>`;
p.innerHTML=`<p class="k">${d.p}</p><h3>Você é ${d.n.toLowerCase()==='imperador'?'o imperador':d.n.toLowerCase()==='gladiador'?'um gladiador':d.n.toLowerCase()==='comerciante'?'um comerciante':d.n.toLowerCase()==='senador'?'um senador':'um soldado'}</h3><p>${d.i}</p><div class="tabs">${TB.map(t=>`<button data-b>${t[0]}</button>`).join('')}</div><div class="tc">${tc}</div>`;
bb(p);p.querySelectorAll('.tabs button').forEach((b,i)=>{b.classList.toggle('on',i==dt);b.onclick=()=>{dt=i;ds()}});if(sc)p.scrollIntoView({behavior:'smooth',block:'nearest'})}
</script></body></html>
